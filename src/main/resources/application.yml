spring:
  application:
    name: pos
  profiles:
    default: central
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5432/pos}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  messages:
    basename: messages
    encoding: UTF-8
  web:
    # Idioma por defecto cuando la petición no trae Accept-Language.
    locale: es
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  compression:
    # Respuestas JSON comprimidas con gzip (la sincronización con las tiendas las necesitará).
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pos:
  security:
    jwt:
      secret: ${POS_JWT_SECRET:dev-only-change-me-0123456789abcdefghij}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    admin-initial-password: ${POS_ADMIN_INITIAL_PASSWORD:}
  sync:
    # Tienda: código para activarse ante la central (solo si la tienda aún no tiene identidad).
    activation-code: ${POS_ACTIVATION_CODE:}
    # Central, SOLO LOCAL: pares "numeroTienda:codigo" que se preparan al arrancar. Vacío en producción.
    dev-activation-codes: ${POS_DEV_ACTIVATION_CODES:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
