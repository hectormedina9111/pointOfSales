spring:
  application:
    name: pos
  profiles:
    default: central
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5432/pos}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  web:
    # Idioma por defecto cuando la petición no trae Accept-Language.
    locale: es
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

pos:
  security:
    jwt:
      secret: ${POS_JWT_SECRET:dev-only-change-me-0123456789abcdefghij}
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    admin-initial-password: ${POS_ADMIN_INITIAL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
