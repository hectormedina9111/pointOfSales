# Texts shown to the user, in English. Keys "error.<CODE>" translate the business rule codes.
# The Spanish text is in messages_es.properties; the default locale is Spanish (spring.web.locale).

error.CATEGORY_CYCLE=A category cannot be its own ancestor
error.CATEGORY_IN_USE=The category has active subcategories or active products
error.CATEGORY_NOT_FOUND=The parent category does not exist
error.COUNTRY_INACTIVE=The country does not exist or is inactive
error.DUPLICATE_BARCODE=The barcode is already in use
error.DUPLICATE_PRODUCT_TAX_COUNTRY=Each country can appear only once in the product taxes
error.DUPLICATE_SKU=The SKU is already in use
error.DUPLICATE_TAX_CODE=The tax code is already used in this country
error.DUPLICATE_UNIT_CODE=The unit of measure code is already in use
error.INVALID_TAX_RATE=The tax rate must be between 0 and 100
error.NEGATIVE_AMOUNT=The amount cannot be negative
error.NEGATIVE_QUANTITY=The minimum stock cannot be negative
error.SERIALS_REQUIRE_INVENTORY=Serial numbers require tracking inventory
error.SERIALS_REQUIRE_WHOLE_UNIT=Serial numbers require a unit without decimals
error.SERVICE_WITH_SERIALS=A service cannot track serial numbers
error.TAX_COUNTRY_IMMUTABLE=The country of a tax cannot be changed
error.TAX_COUNTRY_MISMATCH=The tax does not belong to the given country
error.TAX_INACTIVE=The tax is inactive
error.TAX_IN_USE=The tax is used by products and cannot be deactivated
error.TAX_NOT_FOUND=The tax does not exist
error.UNIT_INACTIVE=The unit of measure is inactive
error.UNIT_NOT_FOUND=The unit of measure does not exist
